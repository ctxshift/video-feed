# Development setup for video-feed.
# https://mise.jdx.dev/

[tools]
bun = "latest"      # builds the binary; the only build dependency
uv = "latest"       # runs the transcription sidecar at runtime
"pipx:yt-dlp" = "latest"

# ffmpeg is a system package -- mise does not manage it.

# Every task is a single command line so it runs identically under sh and under
# cmd.exe. The work that needs real logic lives in scripts/dev.ts, which Bun
# runs on every platform -- there is no shell dependency in this file.

[tasks.build]
description = "Compile dist/vid for this machine"
run = "bun install && bun run build"

# `bun run embed` first: src/asr-embedded.ts is generated and gitignored.
[tasks.check]
description = "Typecheck and test"
run = "bun run embed && bun run typecheck && bun test"

# `dev` and `undev` honour VID_INSTALL_DIR, the same variable the installers
# use. Default is ~/.local/bin, or %LOCALAPPDATA%\Programs\vid on Windows.
[tasks.dev]
description = "Build and put dist/vid on PATH (dev mode)"
depends = ["build"]
run = "bun run scripts/dev.ts link"

[tasks.undev]
description = "Drop the dev link and reinstall the published release"
run = "bun run scripts/dev.ts unlink"
